<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Singing Bowl · 唱歌碗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0b0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            bottom: 18px;
            left: 18px;
            color: #d4b48c;
            background: rgba(10, 8, 6, 0.75);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            letter-spacing: 1px;
            backdrop-filter: blur(6px);
            pointer-events: none;
            z-index: 10;
            border-left: 3px solid #c9a87c;
            font-family: monospace;
            line-height: 1.6;
        }

        #info .chinese {
            font-size: 12px;
            opacity: 0.8;
            display: block;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        #status {
            position: absolute;
            bottom: 18px;
            right: 18px;
            color: #e8d5b0;
            background: rgba(10, 8, 6, 0.7);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            text-align: right;
            line-height: 1.5;
        }

        #status .chinese {
            font-size: 10px;
            opacity: 0.7;
            display: block;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        #debug {
            position: absolute;
            top: 18px;
            right: 18px;
            color: #aac9b0;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 12px;
            border-radius: 8px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }

        #clickHint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #e8d5b0;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(201, 168, 124, 0.3);
            opacity: 0;
            transition: opacity 0.6s;
            text-align: center;
            line-height: 1.8;
        }

        #clickHint.show {
            opacity: 1;
        }

        #clickHint .chinese {
            font-size: 12px;
            opacity: 0.7;
            display: block;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
    </style>
</head>

<body>

    <div id="info">
        🏺 SINGING BOWL · rub the rim with your finger
        <span class="chinese">🏺 唱歌碗 · 用手指摩擦碗边</span>
    </div>
    <div id="status">
        📷 loading camera …
        <span class="chinese">📷 加载摄像头 …</span>
    </div>
    <div id="debug">🎵 waiting …</div>
    <div id="clickHint">
        ▶ click anywhere to activate sound
        <span class="chinese">▶ 点击任意位置启动声音</span>
    </div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js">
    </script>

    <script type="importmap">
        {
            "imports": {
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
            }
        }
    </script>

    <script type="module">
        // ━━━ IMPORTS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

        // ━━━ CANVAS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W = window.innerWidth;
        let H = window.innerHeight;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
        }
        window.addEventListener('resize', resize);
        resize();

        // ━━━ VIDEO (webcam) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.style.display = 'none';

        let handLandmarker = null;
        let mirroredHand = null; // array of 21 landmarks (mirrored)
        let fingerTip = null; // {x,y} normalized
        let lastTip = null;
        let velocity = 0;
        let angleOnRim = 0;
        let fingerOnRim = false;
        let rimGlow = 0;

        // ━━━ AUDIO ENGINE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let audioStarted = false;
        let synth = null;
        let filterNode = null;
        let reverb = null;
        let delay = null;
        let gainNode = null;
        let currentFreq = 440;
        let targetFreq = 440;
        let currentVolume = 0;
        let targetVolume = 0;
        let audioReady = false;

        // Bowl geometry (center, radii)
        let bowl = { cx: 0.5, cy: 0.48, rx: 0.28, ry: 0.22 };

        function getBowlParams() {
            const cx = W * bowl.cx;
            const cy = H * bowl.cy;
            const rx = W * bowl.rx;
            const ry = H * bowl.ry;
            return { cx, cy, rx, ry };
        }

        // Map angle (0..2PI) to frequency (220..880 Hz)
        function angleToFreq(angle) {
            let a = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            const normalized = (Math.sin(a) * 0.5 + 0.5); // 0..1
            return 180 + normalized * 720; // 180..900
        }

        function initAudio() {
            if (synth) return;

            reverb = new Tone.Reverb({ decay: 2.4, wet: 0.45 }).toDestination();
            delay = new Tone.FeedbackDelay("4n", 0.3).connect(reverb);
            filterNode = new Tone.Filter(1200, "lowpass");
            filterNode.Q.value = 3.0;
            gainNode = new Tone.Gain(0.001);

            synth = new Tone.FMSynth({
                harmonicity: 2.2,
                modulationIndex: 6,
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0.6, release: 0.5 },
                modulation: { type: "triangle" },
                modulationEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.4 }
            });

            synth.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(delay);

            synth.volume.value = -6;
            audioReady = true;
        }

        function startAudio() {
            if (audioStarted) return;
            Tone.start().then(() => {
                initAudio();
                audioStarted = true;
                document.getElementById('status').innerHTML =
                    '🔊 singing bowl · move finger on rim<br><span class="chinese">🔊 唱歌碗 · 手指在碗边滑动</span>';
                document.getElementById('clickHint').classList.remove('show');
                if (synth) {
                    gainNode.gain.rampTo(0.08, 0.1);
                    synth.triggerAttackRelease(440, "4n");
                    setTimeout(() => synth.triggerAttackRelease(554, "4n"), 200);
                    setTimeout(() => {
                        gainNode.gain.rampTo(0.001, 0.3);
                    }, 500);
                }
            }).catch(e => console.warn(e));
        }

        // ── update audio based on finger position ──
        function updateAudio(fingerX, fingerY, onRim, angle) {
            if (!audioStarted || !synth) return;

            if (onRim) {
                targetFreq = angleToFreq(angle);
                const dist = getDistanceToRim(fingerX, fingerY);
                //const vol = Math.max(0.02, Math.min(0.30, 0.35 - dist * 3.5));
                const vol = Math.max(0.02, Math.min(0.70, 0.75 - dist * 3.5));

                targetVolume = vol;
                const cutoff = 600 + velocity * 1800;
                filterNode.frequency.rampTo(Math.min(4000, cutoff), 0.05);
                if (velocity > 0.8) {
                    synth.modulationIndex.rampTo(8 + velocity * 4, 0.05);
                } else {
                    synth.modulationIndex.rampTo(6, 0.05);
                }
                rimGlow = Math.min(1, rimGlow + 0.08);
            } else {
                targetVolume = 0.001;
                rimGlow = Math.max(0, rimGlow - 0.02);
                synth.modulationIndex.rampTo(4, 0.1);
            }

            currentFreq += (targetFreq - currentFreq) * 0.12;
            currentVolume += (targetVolume - currentVolume) * 0.12;

            if (currentVolume > 0.005) {
                if (!synth._isActive) {
                    synth.triggerAttack(Tone.Frequency(currentFreq, "hz"), Tone.now());
                }
                synth.setNote(Tone.Frequency(currentFreq, "hz"), Tone.now());
                gainNode.gain.rampTo(currentVolume, 0.02);
            } else {
                if (synth._isActive) {
                    synth.triggerRelease(Tone.now());
                }
                gainNode.gain.rampTo(0.001, 0.05);
            }

            const note = Tone.Frequency(currentFreq, "hz").toNote();
            document.getElementById('debug').innerHTML =
                `🎵 ${note} · ${(currentVolume * 100).toFixed(0)}% · vel ${velocity.toFixed(1)}`;
        }

        // ── distance from point to bowl rim ──
        function getDistanceToRim(x, y) {
            const { cx, cy, rx, ry } = getBowlParams();
            const nx = (x - cx) / rx;
            const ny = (y - cy) / ry;
            const dist = Math.sqrt(nx * nx + ny * ny);
            return Math.abs(dist - 1.0);
        }

        // ── angle of point on ellipse ──
        function getAngleOnRim(x, y) {
            const { cx, cy, rx, ry } = getBowlParams();
            const nx = (x - cx) / rx;
            const ny = (y - cy) / ry;
            return Math.atan2(ny, nx);
        }

        // ━━━ MEDIAPIPE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function setupHands() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 1
                });
                document.getElementById('status').innerHTML =
                    '🎥 ready · raise hand & click<br><span class="chinese">🎥 就绪 · 举起手并点击</span>';
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerHTML = '⚠️ hand tracking error<br><span class="chinese">⚠️ 手势追踪出错</span>';
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await new Promise((resolve) => { video.onloadedmetadata = resolve; });
                video.play();
                document.getElementById('status').innerHTML =
                    '📷 camera ready · raise hand<br><span class="chinese">📷 摄像头就绪 · 举起手</span>';
            } catch (err) {
                console.warn(err);
                document.getElementById('status').innerHTML = '❌ camera denied<br><span class="chinese">❌ 摄像头被拒绝</span>';
            }
        }

        // ── mirror landmarks ──
        function mirrorLandmarks(landmarks) {
            if (!landmarks) return null;
            return landmarks.map(lm => ({ x: 1.0 - lm.x, y: lm.y, z: lm.z }));
        }

        // ── update hand tracking ──
        function updateHandTracking() {
            if (!handLandmarker || video.readyState < 2) return;
            const now = performance.now();
            const results = handLandmarker.detectForVideo(video, now);

            if (results.landmarks && results.landmarks.length > 0) {
                const raw = results.landmarks[0];
                const newMirrored = mirrorLandmarks(raw);
                if (!newMirrored) return;

                const tip = newMirrored[8];
                if (!tip) return;

                if (lastTip) {
                    const dx = tip.x - lastTip.x;
                    const dy = tip.y - lastTip.y;
                    velocity = Math.min(2.5, Math.sqrt(dx * dx + dy * dy) * 180);
                } else {
                    velocity = 0;
                }
                lastTip = { x: tip.x, y: tip.y };

                mirroredHand = newMirrored;
                fingerTip = { x: tip.x, y: tip.y };

                const { cx, cy, rx, ry } = getBowlParams();
                const fx = tip.x * W;
                const fy = tip.y * H;
                const dist = getDistanceToRim(fx, fy);
                const onRim = dist < 0.12;
                fingerOnRim = onRim;

                if (onRim) {
                    angleOnRim = getAngleOnRim(fx, fy);
                }

                updateAudio(fx, fy, onRim, angleOnRim);

            } else {
                velocity *= 0.94;
                if (fingerOnRim) {
                    fingerOnRim = false;
                    rimGlow = Math.max(0, rimGlow - 0.03);
                    updateAudio(0, 0, false, 0);
                }
            }
        }

        // ━━━ DRAWING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ── background: green waves ──
        function drawWaves() {
            const time = performance.now() * 0.0025;
            const stepY = 18;
            const stepX = 10;

            for (let y = 0; y < H + stepY; y += stepY) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(60, 200, 140, ${0.12 + 0.06 * Math.sin(y * 0.01 + time * 0.5)})`;
                ctx.lineWidth = 1.2;
                let first = true;
                for (let x = 0; x <= W; x += stepX) {
                    let wave = Math.sin(x * 0.018 + time * 1.1) * 5;
                    wave += Math.cos(y * 0.025 + time * 0.8) * 4;
                    if (fingerTip) {
                        const hx = fingerTip.x * W;
                        const hy = fingerTip.y * H;
                        const d = Math.hypot(x - hx, (y + wave) - hy);
                        if (d < 180) {
                            wave += Math.sin(d * 0.08 - time * 8) * 14 / (d * 0.05 + 0.6) * (1 - d / 190);
                        }
                    }
                    const drawY = y + wave;
                    if (first) {
                        ctx.moveTo(x, drawY);
                        first = false;
                    } else ctx.lineTo(x, drawY);
                }
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(60, 200, 140, 0.015)';
            for (let i = 0; i < H; i += 3) ctx.fillRect(0, i, W, 1);
        }

        // ── draw porcelain bowl ──
        function drawBowl() {
            const { cx, cy, rx, ry } = getBowlParams();

            // shadow
            ctx.save();
            ctx.shadowBlur = 50;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(cx + 6, cy + 12, rx * 0.95, ry * 0.9, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fill();
            ctx.restore();

            // bowl body
            const grad = ctx.createRadialGradient(cx - rx * 0.3, cy - ry * 0.3, 10, cx, cy, rx * 1.1);
            grad.addColorStop(0, '#faf6ed');
            grad.addColorStop(0.4, '#f0e8d8');
            grad.addColorStop(0.75, '#dcccb8');
            grad.addColorStop(1, '#b8a690');
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // rim highlight
            const rimGrad = ctx.createLinearGradient(cx - rx, cy, cx + rx, cy);
            rimGrad.addColorStop(0, 'rgba(220,200,170,0.0)');
            rimGrad.addColorStop(0.3, 'rgba(240,225,200,0.5)');
            rimGrad.addColorStop(0.5, 'rgba(250,240,220,0.8)');
            rimGrad.addColorStop(0.7, 'rgba(240,225,200,0.5)');
            rimGrad.addColorStop(1, 'rgba(220,200,170,0.0)');
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx * 0.98, ry * 0.97, 0, 0, Math.PI * 2);
            ctx.fillStyle = rimGrad;
            ctx.fill();

            // decorative rim band
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx * 0.93, ry * 0.92, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(180, 140, 100, 0.25)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();

            // inner bowl depth
            const innerGrad = ctx.createRadialGradient(cx - rx * 0.2, cy - ry * 0.2, 10, cx, cy, rx * 0.7);
            innerGrad.addColorStop(0, 'rgba(220,200,170,0.1)');
            innerGrad.addColorStop(0.5, 'rgba(160,140,120,0.15)');
            innerGrad.addColorStop(1, 'rgba(100,80,70,0.25)');
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx * 0.75, ry * 0.70, 0, 0, Math.PI * 2);
            ctx.fillStyle = innerGrad;
            ctx.fill();

            // ── BLUE PORCELAIN DECORATION (thicker lines) ──
            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.strokeStyle = '#3a5a7a';
            ctx.lineWidth = 2.8; // increased from 1.5
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2 + 0.2;
                const x1 = cx + Math.cos(a) * rx * 0.55;
                const y1 = cy + Math.sin(a) * ry * 0.55;
                const x2 = cx + Math.cos(a + 0.3) * rx * 0.75;
                const y2 = cy + Math.sin(a + 0.3) * ry * 0.75;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.quadraticCurveTo(
                    cx + Math.cos(a + 0.15) * rx * 0.7,
                    cy + Math.sin(a + 0.15) * ry * 0.7,
                    x2, y2
                );
                ctx.stroke();
            }
            ctx.restore();

            // rim glow
            if (rimGlow > 0.02) {
                ctx.save();
                const glowIntensity = rimGlow * 0.6;
                const gradGlow = ctx.createRadialGradient(cx, cy, rx * 0.85, cx, cy, rx * 1.05);
                gradGlow.addColorStop(0, `rgba(255, 200, 100, 0)`);
                gradGlow.addColorStop(0.6, `rgba(255, 180, 80, ${glowIntensity * 0.15})`);
                gradGlow.addColorStop(0.85, `rgba(255, 160, 60, ${glowIntensity * 0.4})`);
                gradGlow.addColorStop(1, `rgba(255, 140, 40, ${glowIntensity * 0.1})`);
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx * 1.05, ry * 1.05, 0, 0, Math.PI * 2);
                ctx.fillStyle = gradGlow;
                ctx.fill();

                if (fingerOnRim && fingerTip) {
                    const fx = fingerTip.x * W;
                    const fy = fingerTip.y * H;
                    const spotGrad = ctx.createRadialGradient(fx, fy, 2, fx, fy, 40);
                    spotGrad.addColorStop(0, `rgba(255, 220, 140, ${0.5 * rimGlow})`);
                    spotGrad.addColorStop(0.5, `rgba(255, 180, 80, ${0.25 * rimGlow})`);
                    spotGrad.addColorStop(1, `rgba(255, 140, 40, 0)`);
                    ctx.beginPath();
                    ctx.ellipse(fx, fy, 40, 40, 0, 0, Math.PI * 2);
                    ctx.fillStyle = spotGrad;
                    ctx.fill();
                }
                ctx.restore();
            }

            // rim outline
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(160,130,100,0.3)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        // ── draw hand (thicker skeleton) ──
        function drawHand() {
            if (!mirroredHand) return;

            const points = mirroredHand;
            const tip = points[8];
            if (!tip) return;

            const { cx, cy, rx, ry } = getBowlParams();

            // finger bones (thicker)
            const fingerIndices = [
                [0, 1, 2, 3, 4],
                [0, 5, 6, 7, 8],
                [0, 9, 10, 11, 12],
                [0, 13, 14, 15, 16],
                [0, 17, 18, 19, 20]
            ];

            ctx.save();
            for (let finger of fingerIndices) {
                ctx.beginPath();
                let started = false;
                for (let idx of finger) {
                    const p = points[idx];
                    if (!p) continue;
                    const px = p.x * W;
                    const py = p.y * H;
                    if (!started) {
                        ctx.moveTo(px, py);
                        started = true;
                    } else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = 'rgba(200, 140, 80, 0.45)'; // more opacity
                ctx.lineWidth = 3.5; // thicker
                ctx.stroke();
            }

            // joints (larger)
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                if (!p) continue;
                const px = p.x * W;
                const py = p.y * H;
                const isTip = (i === 8 || i === 12 || i === 16 || i === 20);
                const radius = isTip ? 5.5 : 3.8; // bigger
                ctx.beginPath();
                ctx.arc(px, py, radius, 0, Math.PI * 2);
                ctx.fillStyle = isTip ? 'rgba(220, 160, 90, 0.6)' : 'rgba(180, 130, 80, 0.45)';
                ctx.fill();
            }

            // fingertip glow
            const fx = tip.x * W;
            const fy = tip.y * H;
            const onRim = fingerOnRim;

            if (onRim) {
                const glowSize = 20 + velocity * 12;
                const grad = ctx.createRadialGradient(fx, fy, 2, fx, fy, glowSize);
                grad.addColorStop(0, `rgba(255, 220, 130, ${0.5 + 0.3 * rimGlow})`);
                grad.addColorStop(0.4, `rgba(255, 180, 80, ${0.3 * rimGlow})`);
                grad.addColorStop(1, 'rgba(255, 140, 40, 0)');
                ctx.beginPath();
                ctx.arc(fx, fy, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(fx, fy, onRim ? 9 : 6, 0, Math.PI * 2);
            ctx.fillStyle = onRim ?
                `rgba(255, 200, 120, ${0.7 + 0.3 * rimGlow})` :
                'rgba(200, 160, 110, 0.6)';
            ctx.fill();
            ctx.strokeStyle = onRim ? 'rgba(255, 180, 80, 0.8)' : 'rgba(180, 140, 100, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();

            if (onRim) {
                ctx.save();
                ctx.font = '11px monospace';
                ctx.fillStyle = 'rgba(255, 220, 160, 0.7)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                const note = Tone.Frequency(currentFreq, "hz").toNote();
                ctx.fillText(`♩ ${note}`, fx + 16, fy - 8);
                ctx.restore();
            }
        }

        // ── draw webcam feed (mirrored) ──
        function drawWebcam() {
            if (video.readyState < 2) return;

            const size = Math.min(W * 0.16, H * 0.22, 140);
            const pad = 16;
            const x = W - size - pad;
            const y = H - size - pad - 50;
            const r = 10;

            ctx.save();

            // clip to rounded rect
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + size - r, y);
            ctx.quadraticCurveTo(x + size, y, x + size, y + r);
            ctx.lineTo(x + size, y + size - r);
            ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
            ctx.lineTo(x + r, y + size);
            ctx.quadraticCurveTo(x, y + size, x, y + size - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.clip();

            // ── mirror the video horizontally ──
            ctx.translate(x + size, y);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, size, size);

            ctx.restore(); // restore transform and clip

            // border
            ctx.save();
            ctx.strokeStyle = 'rgba(180, 160, 130, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + size - r, y);
            ctx.quadraticCurveTo(x + size, y, x + size, y + r);
            ctx.lineTo(x + size, y + size - r);
            ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
            ctx.lineTo(x + r, y + size);
            ctx.quadraticCurveTo(x, y + size, x, y + size - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // label
            ctx.save();
            ctx.font = '9px monospace';
            ctx.fillStyle = 'rgba(180, 160, 130, 0.5)';
            ctx.shadowBlur = 0;
            ctx.fillText('📷 you', x + 6, y + size - 6);
            ctx.restore();
        }

        // ── particles ──
        let particles = [];

        function addParticles() {
            if (!fingerOnRim || velocity < 0.2) return;
            const tip = mirroredHand?.[8];
            if (!tip) return;
            const fx = tip.x * W;
            const fy = tip.y * H;
            const count = Math.min(3, Math.floor(velocity * 1.5) + 1);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: fx + (Math.random() - 0.5) * 20,
                    y: fy + (Math.random() - 0.5) * 20,
                    life: 0.6 + Math.random() * 0.8,
                    size: 1.5 + Math.random() * 3,
                    vx: (Math.random() - 0.5) * 1.8,
                    vy: (Math.random() - 0.5) * 1.8 - 0.4,
                    hue: 35 + Math.random() * 20
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.025;
                if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 120, ${p.life * 0.5})`;
                ctx.fill();
            }
        }

        // ── UI overlay (bilingual already handled) ──
        function drawUI() {
            if (!audioStarted) {
                ctx.save();
                ctx.font = 'bold 13px monospace';
                ctx.fillStyle = '#e8d5b0';
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.fillText('▶ click to awaken the bowl', W / 2 - 100, H - 40);
                ctx.restore();
            }
            if (fingerOnRim && audioStarted) {
                const note = Tone.Frequency(currentFreq, "hz").toNote();
                ctx.save();
                ctx.font = '500 13px monospace';
                ctx.fillStyle = '#e8d5b0';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.fillText(`♩ ${note}  ·  rub the rim`, 20, 38);
                ctx.restore();
            }
        }

        // ━━━ RENDER LOOP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderFrame() {
            ctx.clearRect(0, 0, W, H);
            drawWaves();
            drawBowl();
            drawHand();
            drawParticles();
            drawWebcam();
            drawUI();
            requestAnimationFrame(renderFrame);
        }

        function trackingLoop() {
            updateHandTracking();
            addParticles();
            updateParticles();
            requestAnimationFrame(trackingLoop);
        }

        // ━━━ CLICK TO START ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        window.addEventListener('click', () => {
            if (!audioStarted) {
                startAudio();
                document.getElementById('clickHint').classList.remove('show');
            }
        });

        setTimeout(() => {
            if (!audioStarted) {
                document.getElementById('clickHint').classList.add('show');
                document.getElementById('status').innerHTML =
                    '🎚️ click to start singing bowl<br><span class="chinese">🎚️ 点击启动唱歌碗</span>';
            }
        }, 1200);

        // ━━━ BOOT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        async function init() {
            await setupHands();
            await startCamera();
            renderFrame();
            trackingLoop();

            setTimeout(() => {
                if (video.readyState < 2) {
                    document.getElementById('status').innerHTML =
                        '⚠️ camera not ready · refresh<br><span class="chinese">⚠️ 摄像头未就绪 · 刷新</span>';
                }
            }, 4000);
        }

        init().catch(err => {
            console.error(err);
            document.getElementById('status').innerHTML = '❌ init error<br><span class="chinese">❌ 初始化错误</span>';
        });

        window.addEventListener('resize', () => {
            resize();
        });

        console.log('🏺 Singing Bowl · 唱歌碗');
    </script>
</body>

</html>
